name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Analyze and test (Flutter ${{ matrix.label }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest supported version and the latest stable release.
          - label: '3.32, minimum'
            flutter: '3.32.x'
            latest: false
          - label: 'latest stable'
            flutter: '3.x'
            latest: true
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ matrix.flutter }}
          cache: true
      - run: flutter pub get
      - name: Format
        if: matrix.latest
        run: dart format --output=none --set-exit-if-changed .
      - name: Analyze
        if: matrix.latest
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Test example
        working-directory: example
        run: flutter test
      - name: Publish dry run
        if: matrix.latest
        run: dart pub publish --dry-run

  android:
    name: Android build and Kotlin tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build APK
        working-directory: example
        run: flutter build apk --debug
      - name: Kotlin unit tests
        working-directory: example/android
        run: ./gradlew :twin_screen:testDebugUnitTest

  ios:
    name: iOS build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build for device without signing
        working-directory: example
        run: flutter build ios --no-codesign --debug

  web:
    name: Web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build web
        working-directory: example
        run: flutter build web
